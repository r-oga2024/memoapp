
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>メモを編集</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 16px;
            background: #f5f6f8;
            color: #222;
        }

        .panel {
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font: inherit;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        button, .button {
            display: inline-block;
            padding: 10px 14px;
            margin-top: 16px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font: inherit;
            cursor: pointer;
        }

        .secondary {
            background: #666;
        }
    </style>
</head>

<body>
    <h1>メモを編集</h1>

    <section class="panel">
        <form th:action="@{/notes/update/{id}(id=${note.id})}"
              method="post">

            <label for="title">タイトル</label>
            <input id="title" type="text" name="title"
                   th:value="${note.title}"
                   maxlength="100" required>

            <label for="content">本文</label>
            <textarea id="content" name="content"
                      th:text="${note.content}"
                      required></textarea>

            <button type="submit">変更を保存する</button>
            <a class="button secondary" href="/">戻る</a>
        </form>
    </section>
</body>
</html>
