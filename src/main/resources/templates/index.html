
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>マイメモ帳</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 16px;
            background: #f5f6f8;
            color: #222;
        }

        .panel, .note {
            background: white;
            padding: 20px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button, .button {
            display: inline-block;
            padding: 9px 14px;
            margin-top: 12px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font: inherit;
            cursor: pointer;
        }

        .delete {
            background: #c0392b;
        }

        .note-content {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message {
            background: #e7f5e9;
            padding: 12px;
            border-radius: 6px;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .actions form {
            margin: 0;
        }

        .empty {
            color: #666;
        }
    </style>
</head>

<body>
    <h1>マイメモ帳</h1>
    <p>思いついたことを、気軽にメモしよう。</p>

    <p class="message" th:if="${message}"
       th:text="${message}"></p>

    <section class="panel">
        <h2>新しいメモ</h2>

        <form action="/notes" method="post">
            <label for="title">タイトル</label>
            <input id="title" type="text" name="title"
                   maxlength="100" required>

            <label for="content">本文</label>
            <textarea id="content" name="content"
                      required></textarea>

            <button type="submit">保存する</button>
        </form>
    </section>

    <h2>保存したメモ</h2>

    <p class="empty" th:if="${#lists.isEmpty(notes)}">
        まだメモはありません。
    </p>

    <section class="note" th:each="note : ${notes}">
        <strong>タイトル：</strong>
        <p th:text="${note.title}">メモのタイトル</p>

        <strong>本文：</strong>
        <p class="note-content"
           th:text="${note.content}">メモの本文</p>

        <div class="actions">
            <a class="button"
               th:href="@{/notes/edit/{id}(id=${note.id})}">
                編集
            </a>

            <form th:action="@{/notes/delete/{id}(id=${note.id})}"
                  method="post"
                  onsubmit="return confirm('このメモを削除しますか？');">
                <button type="submit" class="delete">削除</button>
            </form>
        </div>
    </section>
</body>
</html>
